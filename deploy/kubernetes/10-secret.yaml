# NetVisor — application secrets.
#
# ⚠️ REPLACE THE PLACEHOLDER VALUES BELOW BEFORE FIRST APPLY — a secret
# committed as-is is a leaked secret. Never commit real values; if a real
# value ever lands here, rotate it (git history keeps everything).
apiVersion: v1
kind: Secret
metadata:
  name: netvisor-secrets
  namespace: netvisor
# stringData → plain-text keys, base64-encoded on apply.
type: Opaque
stringData:
  # Required — signs auth cookies/JWTs. Generate: openssl rand -hex 32
  NETVISOR_JWT_SECRET: "REPLACE_ME_openssl_rand_hex_32"

  # ── Optional (uncomment to enable) ──────────────────────────────────
  # Fernet key encrypting users' stored personal AI keys. Needed only if
  # enabling personal-key AI mode — generate per the README AI section:
  # NETVISOR_ENCRYPTION_KEY: ""
  # Google OAuth Client ID (token-verification flow — no client secret).
  # Presence enables the Google sign-in button:
  # NETVISOR_GOOGLE_CLIENT_ID: ""
