# NetVisor — all-in-one container (backend + tshark + frontend, one image).
# Recommended run path: `docker compose up -d` from this directory.
# Plain `docker run` works too — see README "Run with Docker".
#
# ⚠️ The split volumes below need an image with the volume dirs PRE-CREATED
# owned by the non-root user (image v1.11.0 or newer). Older images
# (≤ v1.10.0) will fail on these mounts with permission errors — either
# upgrade the image tag or keep the legacy single-volume layout until you do.

services:
  netvisor:
    image: tbyczek/netvisor:latest
    # Local build from this repo instead of DockerHub? Comment out `image:`
    # above and uncomment:
    # build: .
    container_name: netvisor
    ports:
      - "8000:8000" # host side remappable (e.g. "8080:8000"); container is fixed at 8000
    volumes:
      # ── Stateful data, SPLIT so a redeployment can never lose it ──
      # Each store is its own named volume: replace/recreate the container
      # freely — DB, captures and topology all survive independently.
      - netvisor-db:/app/data/db # SQLite database (NETVISOR_DB_PATH below)
      - netvisor-captures:/app/data/captures # PCAPs, content-addressed store, topology JSON
    restart: unless-stopped
    environment:
      # Required — signs auth cookies. Compose fails fast if unset:
      # put NETVISOR_JWT_SECRET in a .env file next to this compose file
      # (openssl rand -hex 32) or export it in your shell.
      NETVISOR_JWT_SECRET: ${NETVISOR_JWT_SECRET:?Set NETVISOR_JWT_SECRET (openssl rand -hex 32) in .env or your shell}

      # ── Where the split volumes live (do not change unless you also
      # change the volume mounts above — the paths MUST match them) ──
      NETVISOR_DB_PATH: /app/data/db/netvisor.db
      NETVISOR_PCAP_DIR: /app/data/captures/pcaps
      NETVISOR_PCAPSTORE_DIR: /app/data/captures/pcapstore
      NETVISOR_TOPOLOGY_DIR: /app/data/captures/topology

      # ── All NETVISOR_* configuration ─────────────────────────────────
      # Everything below is OPTIONAL — commented out with the built-in
      # default shown. Uncomment (or put in .env) to override.
      # Full documentation: README "Configuration" table.

      # ── Auth & security ──
      # Login cookie + JWT lifetime, days (users re-login after it passes):
      # NETVISOR_AUTH_TOKEN_EXPIRE_DAYS: ${NETVISOR_AUTH_TOKEN_EXPIRE_DAYS:-7}
      # JWT signing algorithm (leave unless you know why):
      # NETVISOR_JWT_ALGORITHM: ${NETVISOR_JWT_ALGORITHM:-HS256}
      # CORS origins — only needed when frontend and API run on DIFFERENT
      # origins (JSON list). Single-origin container deploys need nothing:
      # NETVISOR_CORS_ORIGINS: ${NETVISOR_CORS_ORIGINS:-["http://localhost:5173","http://localhost:3000"]}
      # Auto-run DB migrations at startup (failure = log + continue):
      # NETVISOR_AUTO_MIGRATE: ${NETVISOR_AUTO_MIGRATE:-true}

      # ── Storage ──
      # Already routed to the split volumes above (DB / captures) — do NOT
      # set the path vars again here unless you also change the mounts.
      # On a bare-metal (non-compose) run the defaults live under /app/data
      # and the data survives any volume/bind-mount of /app/data.

      # ── Uploads ──
      # Max PCAP upload size, bytes (badge in the UI shows the real value):
      # NETVISOR_MAX_UPLOAD_BYTES: ${NETVISOR_MAX_UPLOAD_BYTES:-15728640}
      # Multi-file bundle TOTAL cap, bytes (UI shows it below the file list):
      # NETVISOR_MAX_BUNDLE_BYTES: ${NETVISOR_MAX_BUNDLE_BYTES:-15728640}

      # ── Packet engine ──
      # tshark = richer dissection (built into this image), scapy = pure
      # Python fallback. Unset = auto-detect. The UI badge shows the mode:
      # NETVISOR_PACKET_SOURCE: ${NETVISOR_PACKET_SOURCE:-}

      # ── Frontend serving ──
      # Built frontend dir served by the API at "/" (the image sets
      # /app/dist — leave as is for the all-in-one deployment):
      # NETVISOR_STATIC_DIR: ${NETVISOR_STATIC_DIR:-/app/dist}

      # ── Google OAuth (optional) ──
      # OAuth 2.0 Client ID (token-verification flow — no client secret).
      # Empty = Google sign-in button hidden:
      # NETVISOR_GOOGLE_CLIENT_ID: ${NETVISOR_GOOGLE_CLIENT_ID:-}

      # ── AI: enterprise mode (one key for all users) ──
      # Presence of the key ACTIVATES enterprise AI mode:
      # NETVISOR_LLM_API_KEY: ${NETVISOR_LLM_API_KEY:-}
      # openai = any OpenAI-compatible endpoint; anthropic = native:
      # NETVISOR_LLM_PROVIDER: ${NETVISOR_LLM_PROVIDER:-openai}
      # Endpoint override (OpenRouter, Ollama, vLLM...); empty = default:
      # NETVISOR_LLM_BASE_URL: ${NETVISOR_LLM_BASE_URL:-}
      # Model id for enterprise mode (practically required with a key):
      # NETVISOR_LLM_MODEL: ${NETVISOR_LLM_MODEL:-}
      # false = disable personal BYO keys, enterprise key only:
      # NETVISOR_LLM_ALLOW_PERSONAL_KEYS: ${NETVISOR_LLM_ALLOW_PERSONAL_KEYS:-true}
      # Enterprise-mode rate limit: questions per user / 15 min (0 = off):
      # NETVISOR_LLM_RATE_LIMIT_15MIN: ${NETVISOR_LLM_RATE_LIMIT_15MIN:-20}
      # Master AI kill-switch:
      # NETVISOR_LLM_ENABLED: ${NETVISOR_LLM_ENABLED:-true}

      # ── AI: personal keys (per-user BYO key) ──
      # Fernet key encrypting users' stored personal keys. REQUIRED for
      # the personal-key mode. Generate:
      #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      # NETVISOR_ENCRYPTION_KEY: ${NETVISOR_ENCRYPTION_KEY:-}
    # Alternatively keep the full NETVISOR_* set in one file:
    # env_file:
    #   - .env

# ── Upgrading from the pre-split single-volume layout (compose files older
# than v1.11): your data lives in the old `netvisor-data` volume. Copy it
# into the new volumes ONCE, then remove the old volume:
#   docker run --rm -v netvisor-data:/from -v netvisor-db:/to alpine \
#     sh -c "mkdir -p /to && cp /from/netvisor.db /to/ 2>/dev/null || true"
#   docker run --rm -v netvisor-data:/from -v netvisor-captures:/to alpine \
#     sh -c "cp -r /from/pcaps /from/pcapstore /from/topology /to/ 2>/dev/null || true"
#   docker volume rm netvisor-data
volumes:
  netvisor-db:
  netvisor-captures:
